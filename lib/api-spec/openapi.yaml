                $ref: "#/components/schemas/SuccessResponse"

  /ai/verifications/{verificationId}/dismiss:
    post:
      operationId: dismissAIVerification
      tags: [ai]
      summary: Dismiss AI verification (keep original answer)
      parameters:
        - name: verificationId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # AI Question Generation (3e)
  /chapters/{chapterId}/ai-generate-questions:
    post:
      operationId: generateAIQuestions
      tags: [ai]
      summary: Generate AI questions from textbook pages
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateQuestionsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateQuestionsResponse"

  /chapters/{chapterId}/ai-generated-questions:
    get:
      operationId: listAIGeneratedQuestions
      tags: [ai]
      summary: List AI-generated question drafts for a chapter
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, dismissed]
        - name: limit
          in: query
          schema:
            type: number
        - name: offset
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGeneratedQuestionPage"

  /ai-generated-questions/{questionId}:
    get:
      operationId: getAIGeneratedQuestion
      tags: [ai]
      summary: Get a specific AI-generated question draft
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGeneratedQuestion"

  /ai-generated-questions/{questionId}/approve:
    post:
      operationId: approveAIGeneratedQuestion
      tags: [ai]
      summary: Approve and save AI-generated question as real question
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /ai-generated-questions/{questionId}/dismiss:
    post:
      operationId: dismissAIGeneratedQuestion
      tags: [ai]
      summary: Dismiss AI-generated question draft
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # AI Grading (3f)
  /attempts/{attemptId}/answers/{answerId}/ai-grade:
    post:
      operationId: aiGradeAnswer
      tags: [ai]
      summary: Get AI grading suggestion for a written answer
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: number
        - name: answerId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIGradeAnswerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGradeResponse"

  # Ask Book Chat (3g)
  /ai/chat/sessions:
    get:
      operationId: listAIChatSessions
      tags: [ai]
      summary: List user's AI chat sessions
      parameters:
        - name: subjectId
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
        - name: offset
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatSessionPage"
    post:
      operationId: createAIChatSession
      tags: [ai]
      summary: Create a new AI chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAIChatSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatSession"

  /ai/chat/sessions/{sessionId}:
    get:
      operationId: getAIChatSession
      tags: [ai]
      summary: Get an AI chat session with messages
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
        - name: offset
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatSessionWithMessages"

  /ai/chat/sessions/{sessionId}/messages:
    post:
      operationId: sendAIChatMessage
      tags: [ai]
      summary: Send a message in an AI chat session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAIChatMessageInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendAIChatMessageResponse"

  # Module 7 - Textbook Library
  /books/{subjectId}/assets:
    get:
      operationId: listSubjectAssets
      tags: [ai]
      summary: List stored file assets for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAssetListResponse"
        "401":
          description: Unauthorized

  /books/{subjectId}/answer:
    post:
      operationId: answerFromBook
      tags: [ai]
      summary: Answer a question using the subject's textbook
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerFromBookInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerFromBookResponse"
        "400":
          description: Bad request
        "404":
          description: Subject or textbook not found
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # â”€â”€ Auth â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
        password:
          type: string
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

