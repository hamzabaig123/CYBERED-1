      required: [sessions, total, limit, offset]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AIChatSessionListItem"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number

    AIChatSessionListItem:
      type: object
      required: [id, subjectId, createdAt, subjectName, messageCount]
      properties:
        id:
          type: number
        subjectId:
          type: number
        createdAt:
          type: string
          format: date-time
        subjectName:
          type: string
        messageCount:
          type: number

    AIChatSessionWithMessages:
      type: object
      required: [session, messages]
      properties:
        session:
          $ref: "#/components/schemas/AIChatSession"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AIChatMessage"

    AIChatMessage:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id:
          type: number
        sessionId:
          type: number
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        citationsJson:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        createdAt:
          type: string
          format: date-time

    CreateAIChatSessionInput:
      type: object
      required: [subjectId]
      properties:
        subjectId:
          type: number

    SendAIChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    SendAIChatMessageResponse:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/AIChatMessage"
        assistantMessage:
          type: object
          required: [id, sessionId, role, content, createdAt, citations]
          properties:
            id:
              type: number
            sessionId:
              type: number
            role:
              type: string
              enum: [user, assistant]
            content:
              type: string
            citations:
              type: array
              items:
                $ref: "#/components/schemas/Citation"
            createdAt:
              type: string
              format: date-time

